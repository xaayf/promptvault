      html, body { margin: 0; background: #020617; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;

      #boot small { font-weight: 400; font-size: 12px; opacity: .7; }

  <body>
    <div id="root">
      <div id="boot"><img src="/apple-touch-icon.png" alt="" /><span>PromptVault Pro</span><small id="boot-msg">Memuat…</small></div>
    </div>
    <noscript><p style="color:#e2e8f0;text-align:center;font-family:sans-serif">Aktifkan JavaScript untuk memakai PromptVault.</p></noscript>
    <script>
      // Kalau app belum muncul dalam 10 detik, tampilkan petunjuk (bukan layar kosong)
      setTimeout(function () {
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = 'Lama banget? Tutup lalu buka ulang app, atau cek koneksi.';
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
